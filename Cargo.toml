[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/ffi", "crates/ui", "crates/setup"]
# Plain `cargo build` on macOS/Linux builds the portable crates; `ui` and
# `setup` are WinUI/Win32-only (build them with `--workspace` on Windows).
default-members = ["crates/core", "crates/cli", "crates/ffi"]

# Vendored windows-canvas with a shared GPU device for demand canvases —
# see vendor/windows-canvas/PATCH.md (5 chart devices → 1: -168 threads, -75MB).
[patch.crates-io]
windows-canvas = { path = "vendor/windows-canvas" }

[workspace.package]
version = "0.8.6"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
globaltokentracker-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
ignored_unit_patterns = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
float_cmp = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
single_match_else = "allow"
if_not_else = "allow"
ref_option = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"
option_option = "allow"
match_bool = "allow"
unnecessary_wraps = "allow"
large_stack_arrays = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
