name: Verify branch

# Verify-only: the same build / test / clippy / package checks the release
# workflows run, for work branches before they are merged. Never publishes,
# tags or reads secrets; the release workflows (main only) stay the gate
# for anything shipped.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'integrations/**/docs/**'
      - 'integrations/**/README.md'
      - '.github/release-templates/README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'integrations/**/docs/**'
      - 'integrations/**/README.md'
      - '.github/release-templates/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows runners default stdout to cp1252; printing Chinese warnings would
  # raise UnicodeEncodeError in the Python helpers.
  PYTHONUTF8: "1"
  GTT_RELEASE_TAG: ""

jobs:
  python:
    name: Release tooling and model-router gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Bytecode compile check
        id: py_compile
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .github/release-templates integrations/model-router/gtt_router

      - name: Release-note and workflow gate tests
        id: release_tooling
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s .github/release-templates \
            -p 'test_*.py'

      - name: Model-router regression tests
        id: model_router
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        working-directory: integrations/model-router
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests \
            -p 'test_*.py'

  windows:
    name: Windows build, test, clippy and package-check
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve source-controlled build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-templates/validate_build.py \
            --cargo-toml Cargo.toml \
            --channel alpha \
            --release-tag "" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "### Verify source"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Subject: $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      # Named gates that do not short-circuit each other: one run reports
      # every format, lint and unit test failure. Skip expensive LTO release
      # builds if static/unit gates already failed.
      - name: Rustfmt (check formatting)
        id: fmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        id: clippy
        if: ${{ !cancelled() && steps.rust_toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        id: unit_tests
        if: ${{ !cancelled() && steps.rust_toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked

      - name: Release build
        id: release
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' && steps.clippy.outcome == 'success' && steps.unit_tests.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # package.ps1 builds globaltokentracker-setup once with the real payload.
          cargo build --release --locked -p globaltokentracker-ui -p globaltokentracker-cli

      - name: Validate installer packaging
        id: package
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        shell: pwsh
        run: |
          installer\package.ps1 -SkipBuild
          $exe = Get-Item "dist\GlobalTokenTracker-Setup-${{ steps.identity.outputs.version_name }}-win-x64.exe"
          if ($exe.Length -lt 1MB) { throw "installer suspiciously small: $($exe.Length)" }
          "installer_size=$($exe.Length)" >> "$env:GITHUB_STEP_SUMMARY"

      - name: Upload unsigned installer (testing only)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-${{ github.sha }}
          path: dist/GlobalTokenTracker-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS app and disk image
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve source-controlled build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-templates/validate_build.py \
            --cargo-toml Cargo.toml \
            --channel alpha \
            --release-tag "" \
            --github-output "$GITHUB_OUTPUT"

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Set up Rust toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      # The Windows job never compiles cfg(target_os = "macos") code.
      - name: Clippy (macOS portable crates)
        id: macos_clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p globaltokentracker-core -p globaltokentracker-cli -p globaltokentracker-ffi \
            --all-targets --locked -- -D warnings

      - name: Unit tests (macOS portable crates)
        id: macos_tests
        if: ${{ !cancelled() && steps.rust_toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p globaltokentracker-core -p globaltokentracker-cli -p globaltokentracker-ffi --locked

      # Ad-hoc signed: no signing identity or notarization secrets here.
      - name: Build universal app and disk image
        id: dmg
        if: ${{ !cancelled() && steps.macos_clippy.outcome == 'success' && steps.macos_tests.outcome == 'success' }}
        shell: bash
        env:
          VERSION_NAME: ${{ steps.identity.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          macos/scripts/build-app.sh --universal
          macos/scripts/build-dmg.sh "$tag"
          dmg="GlobalTokenTracker-${tag}-macos-universal.dmg"
          test -s "target/macos/$dmg"
          echo "dmg_filename=$dmg" >> "$GITHUB_OUTPUT"

      - name: Verify disk image contents
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        shell: bash
        env:
          DMG: target/macos/${{ steps.dmg.outputs.dmg_filename }}
        run: |
          set -euo pipefail
          size=$(stat -f%z "$DMG")
          if (( size < 1048576 )); then echo "disk image suspiciously small: $size"; exit 1; fi
          mount="$(hdiutil attach -readonly -nobrowse -noautoopen "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')"
          trap 'hdiutil detach -quiet "$mount" || true' EXIT
          app="$mount/GlobalTokenTracker.app"
          lipo "$app/Contents/MacOS/GlobalTokenTracker" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=1 "$app"
          test "$(readlink "$mount/Applications")" = /Applications
          test -s "$mount/.background.tiff"
          test -s "$mount/.DS_Store"

      - name: Upload unsigned disk image (testing only)
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-${{ github.sha }}
          path: target/macos/${{ steps.dmg.outputs.dmg_filename }}
          if-no-files-found: error
          retention-days: 3
