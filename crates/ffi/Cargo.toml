[package]
name = "globaltokentracker-ffi"
version.workspace = true
edition = "2024"

# C ABI over the core engine for native shells (the SwiftUI macOS app).
[lib]
name = "gtt_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
globaltokentracker-core = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
