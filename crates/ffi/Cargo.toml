[package]
name = "globaltokentracker-ffi"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# C ABI over the core engine for native shells (the SwiftUI macOS app).
[lib]
name = "gtt_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
globaltokentracker-core = { workspace = true }
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
